name: vibes-clickui-app

services:
  app:
    build:
      context: .
      args:
        ORIGIN: ${ORIGIN:?}
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - '3000:3000'
    restart: unless-stopped

networks:
  default:
    name: vibes-clickui
