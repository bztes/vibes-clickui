name: vibes-clickui-telemetry

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_WRITER_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_UI_PASSWORD: ${CLICKHOUSE_READONLY_PASSWORD:?}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/vibes-clickui.xml:ro
    ports:
      - '${CLICKHOUSE_HTTP_PORT:?}:8123'
      - '${CLICKHOUSE_TCP_PORT:?}:9000'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:?}
      CLICKHOUSE_USER: ${CLICKHOUSE_WRITER_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?}
      OTLP_TOKEN: ${OTLP_TOKEN:?}
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '${OTLP_GRPC_PORT:?}:4317'
      - '${OTLP_HTTP_PORT:?}:4318'
    depends_on:
      clickhouse:
        condition: service_healthy

networks:
  default:
    name: vibes-clickui

volumes:
  clickhouse-data:
